[project]
name = "after-rain-seq"
version = "0.1.0"
description = "Generative MIDI host for Ambient Dub Techno — Push 2 + Raspberry Pi 5 + isobar"
requires-python = ">=3.13"
dependencies = [
    "isobar>=0.2.1",
    "mido",
    "python-rtmidi",
    "pyusb",
    "numpy",
    "pyyaml",
    "pillow",
    "pydantic>=2.0",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
link = ["linkpython-extern"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "black",
    "isort",
    "types-pyyaml",
]

[tool.ruff]
target-version = "py313"

[tool.mypy]
python_version = "3.13"

[tool.black]
target-version = ["py313"]

[tool.isort]
profile = "black"
