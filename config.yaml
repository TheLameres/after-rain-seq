# after-rain-seq configuration — created automatically on first run.
# Edit this file to customize your setup.

logging:
  level:
    root: INFO

sync:
  enabled: true
  clock_source: "internal"
  midi_clock_device: null
  bpm: 120.0
  swing_amount: 0.0

ports:
  outputs:
    - label: "main"          # как дорожки ссылаются на порт
      match: "IAC Channel 1"     # подстрока имени системного порта
      role: melodic          # melodic | drum | clock
      serial: null           # нужен только при неоднозначном match
      no_automation: false   # true — не слать сюда CC-автоматизацию
  inputs:
    - label: "clock-in"
      match: "IAC Channel 1"     # источник MIDI Clock
      role: clock

cc_map:
  default:
    filter: 74
    resonance: 71
    reverb: 91
    delay: 93
    delay_feedback: 94
    mod_wheel: 1
    volume: 7
    pan: 10
  ports: {}

mutation:
  enabled: true
  mutate_min_seconds: 8.0
  mutate_max_seconds: 16.0
  default_mutate: 0.5
  drift_step_gate: 0.05
  drift_step_density: 0.1
  drift_step_register: 1.0

devices:
  push2:
    enabled: true
    brightness: 255
    use_user_midi_port: false
    simulate: false
    display_enabled: true
    display_fps: 25

  lcxl3:
    enabled: true
    midi_in_port_name: "LCXL3 1 DAW Out"
    midi_out_port_name: "LCXL3 1 DAW In"
